# Lint, type-check and unit-test every push. The same command runs on a developer machine
# (`python scripts/check.py`), so CI and local results cannot drift apart.
#
# Not runnable locally (no GitHub Actions runner): to validate the file after editing, parse it:
#   python -c "import yaml,pathlib;print(yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')))"
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken combination must not hide the others: Windows and 3.11 fail differently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the dev extra: the unit tests touch no database, and database drivers are extra-gated
      # so a missing wheel for one adapter cannot block every platform.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show interpreter
        run: python --version

      - name: Check (ruff + mypy + unit tests)
        run: python scripts/check.py
