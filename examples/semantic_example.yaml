# examples/semantic_example.yaml
# Worked example of the semantic layer. The first organisation is only a deployment example: nothing here is hard-coded in the core.
# The pipeline writes generated/*.yaml. Humans write curated/*.yaml and curated wins on conflict.
version: 17

sources:
  crm:      { adapter: postgresql, secret: crm_ro,     load: { max_concurrency: 3 } }
  billing:  { adapter: postgresql, secret: billing_ro, load: { max_concurrency: 3 } }   # an Oracle database in the real deployment
  erp:      { adapter: postgresql, secret: erp_ro }                                      # a SQL Server database in the real deployment
  api_fx:   { adapter: openapi, spec: specs/fx.yaml,
              auth: { header: X-API-Key, secret: fx_project_key },
              rate_limit: { shared_pool: true, rps: 2 } }   # conservative until the real budget is known

defaults:
  cache: { staleness_ratio: 0.01, min_ttl: 30s, max_ttl: 7d }
  quiet_windows:                     # heavy jobs (profiling, statistics, mining) only here
    - { tz: Asia/Jerusalem, start: "21:00", end: "07:00" }   # deployment example

value_maps:
  customer_status:
    canonical: [active, churned, suspended]
    synonyms:                         # both languages, used on index and query side
      active:    ["פעיל", "active"]
      churned:   ["עזב", "churned"]
      suspended: ["מושעה", "suspended"]
    sources:
      crm.customers.status:        { A: active, C: churned, S: suspended }
      billing.accounts.state:      { Active: active, Closed: churned, Hold: suspended }
      erp.customers.status_code:   { 1: active, 2: churned, 3: suspended }

measures:
  credit_limit_r5000:                 # same business field, three storage forms
    canonical: { rounding: { to: 5000, mode: half_up } }    # mode: to be approved by the owner
    sources:
      crm.customers.credit_limit:      { normalize: "{col}" }
      billing.accounts.credit_limit:   { normalize: "ROUND({col} / 5000) * 5000" }
      erp.customers.limit_k:           { normalize: "{col} * 10" }
    provenance: { detected_by: pipeline/D8, match_rate: 0.998, approved_by: data-team }

  usage_units:                        # the usage measure: units recorded per event
    canonical: {}                     # no rounding: a unit count is exact, so nothing to declare
    sources:
      billing.usage_events.units:     { normalize: "{col}" }
    provenance: { detected_by: pipeline/D1+D2, evidence: "identity: the catalog declares units" }

tables:
  billing.usage_events:
    key: [event_id]
    default_window: 7d
    partitioning: { key: start_time, granularity: month, require_key_filter: true }
    time_columns:
      start_time:     { role: event_time, indexed: true, use_by_default: true }
      insertion_time: { role: ingestion_time, derives_bound_on: start_time,
                        lag: { min: 0s, max: 6h, verify: nightly } }
    mutability: { class: append_rarely, status: approved }
  # The keys make aggregates on these tables count each entity once. erp.customers really does hold
  # identical duplicate rows, which is why E01's oracle dedupes on the key before averaging.
  crm.customers:
    key: [cust_id]
  billing.accounts:
    key: [client_no]
  erp.customers:
    key: [cust_no]
  billing.accounts_hist:
    mutability: { class: mutable_critical, status: approved }
    cache: { mode: none }

labels:
  # The words people actually type, per thing, in whatever language they use. A curated file holds
  # these; the context index matches them, so one field serves every language and no schema is
  # language specific. Keys are 'table:<source.table>', 'measure:<name>' or 'column:<qualified>'.
  measure:credit_limit_r5000: ["מסגרת אשראי", "credit limit", "מסגרת"]
  measure:usage_units: ["יחידות שימוש", "usage units", "שימוש"]
  table:crm.customers: ["לקוחות", "customers"]
  table:billing.accounts: ["חשבונות", "accounts"]
  table:erp.customers: ["לקוחות ERP", "customers"]
  table:billing.usage_events: ["אירועי שימוש", "usage events"]

approved_joins:
  - name: usage_to_customers
    left:  billing.usage_events.client_no          # zero-padded VARCHAR(10), e.g. '0000001234'
    right: crm.customers.cust_id                   # INT
    on: "LPAD(CAST({right} AS VARCHAR), 10, '0') = {left}"   # conversion belongs to the approved join
    cardinality: many_to_one
    usage: { count_90d: 1840, users_90d: 37 }      # from mining. Orders presentation only
