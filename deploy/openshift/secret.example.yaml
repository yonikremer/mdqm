# A TEMPLATE, not a deployment object. Never commit a filled-in copy.
#
# Every value below is a placeholder. Replace them and create the Secret from
# files, so no value ever appears on a command line, in shell history or in
# this repository:
#
#   oc create secret generic mdqm-secrets --from-file=tokens.json \
#       --from-file=crm_ro --from-file=billing_ro \
#       --from-literal=MDQM_MODEL__API_KEY=... -n mdqm
#
# How the pod consumes each key (deployment.yaml mounts the whole Secret at
# /run/secrets with mode 0440):
#   tokens.json              the token file itself; MDQM_TOKENS_FILE points at
#                            /run/secrets/tokens.json. Shape:
#                            {"tokens":[{"token":..., "user_id":...,
#                             "display_name":..., "scopes":["mdqm.read"]}]}
#                            One entry per person, own token each. The server
#                            refuses to start without this file.
#   <source secret name>     one file per SourceConfig.secret reference. The
#                            file name is the reference name, the file content
#                            is the value (a password, an API token). This is
#                            what FileSecretProvider reads from
#                            MDQM_SECRETS__DIR=/run/secrets.
#   MDQM_MODEL__API_KEY      read into the process environment by
#                            valueFrom.secretKeyRef; also harmless as a file.
#   MDQM_SMTP__PASSWORD      same, for the weekly digest relay.
#
# Everything marked CHANGEME must be replaced; a pod that starts with these
# values serves nothing useful (the token is public in this repo).
apiVersion: v1
kind: Secret
metadata:
  name: mdqm-secrets
  labels:
    app.kubernetes.io/name: mdqm
    app.kubernetes.io/component: mcp-server
type: Opaque
stringData:
  # Shape of the token file, with an unusable token. Replace the whole value.
  tokens.json: |
    {"tokens": [{"token": "CHANGEME-token-value", "user_id": "CHANGEME-user",
                 "display_name": "CHANGEME Person", "scopes": ["mdqm.read"]}]}
  # One key per source secret reference, e.g. crm_ro / billing_ro / erp_ro.
  crm_ro: CHANGEME-source-credential
  billing_ro: CHANGEME-source-credential
  erp_ro: CHANGEME-source-credential
  # Optional: only needed once a model endpoint requires a key.
  MDQM_MODEL__API_KEY: CHANGEME-model-api-key
  # Optional: only needed when the SMTP relay authenticates.
  MDQM_SMTP__PASSWORD: CHANGEME-smtp-password
