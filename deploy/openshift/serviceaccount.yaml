# The pod's identity. Only one job: give the Deployment a service account the
# SCC grant can name. The server never calls the Kubernetes API, so the token
# is not mounted (deployment.yaml sets automountServiceAccountToken: false).
#
# SCC decision, exactly:
#
#   * `restricted-v2` (the default for a service account) allocates its own UID
#     from the namespace range and ignores `runAsUser`. The image owns /data,
#     /cache and /semantic as 10001:10001 and expects that UID, so this would
#     work only by luck of a matching range and a group-writable volume.
#   * `nonroot-v2` (OpenShift 4.11+) allows ANY non-zero UID, so the explicit
#     `runAsUser: 10001` / `runAsGroup: 10001` in deployment.yaml is honoured.
#     It still requires: no privilege escalation, all capabilities dropped, no
#     host mounts, seccomp RuntimeDefault - exactly what the pod requests.
#   * `anyuid` also works and is broader than needed. Do not ask for it.
#
# The operator runs this once, as a cluster-admin, for the namespace mdqm:
#
#   oc adm policy add-scc-to-user nonroot-v2 -z mdqm -n mdqm
#
# Without the grant the pod is admitted by restricted-v2, gets a random UID,
# and fails to open the SQLite file on the volume: a CrashLoopBackOff with
# "unable to open database file" in `oc logs`. That is the symptom to expect,
# not a data loss.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdqm
  labels:
    app.kubernetes.io/name: mdqm
    app.kubernetes.io/component: mcp-server
automountServiceAccountToken: false
