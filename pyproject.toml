[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdqm"
version = "0.0.1"
description = "Multi DB Query MCP: a thin, weak-agent-friendly MCP server for querying many databases and APIs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "mcp>=2,<3",              # NOTE: 2.x renamed FastMCP to MCPServer. See AGENTS.md "MCP SDK".
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlglot>=30",
  "duckdb>=1.1",
  "pyarrow>=17",
  "httpx>=0.27",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
  "tzdata>=2024.1",         # F03: zoneinfo has no tz database on Windows (pure Python wheel).
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
oracle = ["oracledb>=2.3"]            # Thin mode only: no Oracle Client
mssql = ["mssql-python>=1.0"]            # D06. Ships wheels for Windows/Linux/macOS and bundles the ODBC driver and its DLLs, so nothing is installed on the host at runtime. A08 still owns the final choice.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "hypothesis>=6.100",
  "jsonschema>=4",                # tests/unit/test_models.py validates the exported JSON Schemas
  "fastapi>=0.110",                   # only for the mock OpenAPI service in tests
  "uvicorn>=0.30",                # D04: the mock's ephemeral-port fixture and its container entry point
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.5",             # .pre-commit-config.yaml: local hooks only, so no network at hook time
  "types-PyYAML",
]
all = ["mdqm[pg,oracle,mssql,dev]"]

# Adapters register here. Third parties add their own with the same group name.
[project.entry-points."mdqm.adapters"]
postgresql = "mdqm.adapters.postgresql:PostgresAdapter"
openapi = "mdqm.adapters.openapi:OpenApiAdapter"
elastic = "mdqm.adapters.elastic:ElasticAdapter"
oracle = "mdqm.adapters.oracle:OracleAdapter"
sqlserver = "mdqm.adapters.sqlserver:SqlServerAdapter"

[project.scripts]
mdqm = "mdqm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mdqm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs docker-compose services (see docs/dev-env.md). Use --require-services to fail instead of skip.",
  "slow: takes more than ~10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]                     # assert is fine in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"scripts/**" = ["E501", "S603", "S607", "S310"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# pyarrow ships no py.typed marker (checked on the pinned version), so strict mode would reject
# every annotation that names an Arrow type instead of using it.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# psycopg is the optional `pg` extra (AGENTS.md section 3): `src/mdqm/testing/loaders/postgres.py`
# imports it at module level, which is right at runtime but must not stop mypy from checking the
# rest of `src` on a machine that never installed the extra.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

# mssql-python is the optional `mssql` extra (task D06); CI installs `.[dev]` only, so mypy must
# not demand the driver on a machine that never loads the SQL Server dataset.
[[tool.mypy.overrides]]
module = ["mssql_python", "mssql_python.*"]
ignore_missing_imports = true

# oracledb is the optional `oracle` extra (AGENTS.md section 3). Same reason: the adapter imports it
# at module level, which is right at runtime and must not stop mypy from checking the rest of `src`
# on a machine that never installed the extra.
[[tool.mypy.overrides]]
module = ["oracledb", "oracledb.*"]
ignore_missing_imports = true

# Typing scope for editors and the LSP, matching what CI enforces ([tool.mypy]: strict on "src").
# pyright is not part of scripts/check.py, so it must not report against rules this project does
# not adopt: `scripts/` is untyped by policy (mypy's `files = ["src"]`), and sqlglot exposes
# `Expression` at runtime without listing it in its stub __all__, so every legitimate
# `exp.Expression` would otherwise trip reportPrivateImportUsage.
[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".worktrees", "**/node_modules", "**/__pycache__"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
reportPrivateImportUsage = false
